<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Driving Companion</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Canvas -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- VFX Overlays -->
    <div class="scanlines"></div>
    <div class="overlay"></div>

    <div class="ui-container">
        <h1>AI Driving Companion</h1>

        <div class="hud-ring">
            <div class="ring-outer"></div>
            <div class="ring-inner"></div>

            <!-- Main Button -->
            <div class="mic-btn" id="mic-btn" onclick="toggleListening()">
                <svg viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"></path>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"></path>
                </svg>
            </div>
        </div>

        <!-- Text Interaction Area -->
        <div class="interaction-panel">
            <div class="interaction-label">
                <span>System Status: <span id="status-text" style="color:var(--neon-cyan)">Online</span></span>
                <span>AI-V.05</span>
            </div>
            <div id="output-container">
                <span class="output-text" id="typewriter">Press microphone to speak...</span><span class="cursor"></span>
            </div>
        </div>
    </div>

    <!-- Link to external JS -->
    <script src="script.js"></script>
</body>
</html>
